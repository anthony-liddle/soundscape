name: Publish Engine

on:
  push:
    tags:
      - 'engine-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#engine-v}"
          PKG_VERSION=$(node -p "require('./packages/engine/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match packages/engine/package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Run engine tests
        run: pnpm --filter soundscape-engine test run

      - name: Build engine
        run: pnpm --filter soundscape-engine build

      - name: Check engine packaging
        run: pnpm --filter soundscape-engine check:package

      - name: Copy LICENSE into package
        run: cp LICENSE packages/engine/LICENSE

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/engine
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
