name: Publish Engine

on:
  push:
    tags:
      - 'engine-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      # No registry-url here: it writes an .npmrc referencing ${NODE_AUTH_TOKEN},
      # which breaks tokenless OIDC trusted publishing when that env is unset.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#engine-v}"
          PKG_VERSION=$(node -p "require('./packages/engine/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match packages/engine/package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Run engine tests
        run: pnpm --filter soundscape-engine test run

      - name: Build engine
        run: pnpm --filter soundscape-engine build

      - name: Check engine packaging
        run: pnpm --filter soundscape-engine check:package

      - name: Copy LICENSE into package
        run: cp LICENSE packages/engine/LICENSE

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # Auth via the npm Trusted Publisher for this repo + workflow (OIDC).
      # No token; provenance is generated automatically. Prerelease versions
      # (anything with a hyphen, e.g. 0.3.0-rc.1) publish under the "next"
      # dist-tag so they never land on "latest".
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
        working-directory: packages/engine
