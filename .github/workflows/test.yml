name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm -r lint

      # The build's tsc leaves the tests out, so this checks the engine with them
      - name: Type-check the engine, tests included
        run: pnpm --filter soundscape-engine typecheck

      - name: Run tests
        run: pnpm -r test run

      - name: Build
        run: pnpm -r build

      - name: Check engine packaging
        run: pnpm --filter soundscape-engine check:package

  # The Swift library on Linux: its own tests, the shared cue corpus, the
  # generator held against the engine, a check that the corpus's recorded
  # answers are still the engine's, and every reference cue rendered and held
  # to the bar. Node runs the engine's TypeScript source
  # directly, so nothing is installed for it. The player, on AVFoundation,
  # builds to nothing here; the apple job tests it.
  #
  # No paths filter, here or on the workflow: test is a required check, and a
  # workflow skipped by a filter leaves it pending, which blocks the merge.
  swift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test, the corpus included
        run: swift test

      - name: The corpus's recorded answers are the engine's
        run: node conformance/cues/expect.mjs --check

      - name: The generator, against the engine
        run: |
          node conformance/cues/generate.mjs --seed 1 --count 3000 --out .build/generated.jsonl
          CUE_GENERATED=.build/generated.jsonl swift test --filter GeneratedTests

      # Linux renders are held to the bar, not to macOS's hashes: glibc computes
      # sin, cos and pow differently from Darwin. The determinism test in swift
      # test above counts how many match.
      - name: Render every reference cue, and the positive controls
        run: CUE_RENDER_OUT=.build/renders swift test --filter ReferenceRenders

      - name: Every render within the bar, measured by Peach's measure()
        run: node conformance/cues/render/judge.mjs .build/renders

      - name: Every positive control misses the bar, and 0.05 dB louder passes
        run: node conformance/cues/render/judge.mjs .build/renders --controls

  # The Swift package on Apple's platforms: every suite on macOS, the player's
  # AVFoundation ones included, then every suite again in the iOS Simulator,
  # where the audio session lives. The runner's default Xcode is a 26, so this
  # is the player before the 27 SDKs: the iOS 17 to 26 interruption
  # notification, and AVFoundation's calls that do not throw. Xcode 27, and
  # iOS 27's notifications, are tested locally until a runner has them.
  apple:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Simulator runtimes
        run: xcrun simctl list runtimes

      - name: Test on macOS, the player included
        run: swift test

      # The newest iOS runtime's first iPhone
      - name: Test in the iOS Simulator
        run: |
          id=$(xcrun simctl list devices available --json | jq -r '[.devices | to_entries | sort_by(.key) | reverse | .[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator $id"
          xcodebuild test -scheme Soundscape-Package -destination "platform=iOS Simulator,id=$id" -parallel-testing-enabled NO

      # Cue Check, the app for hearing the player on a phone, still builds
      # against the library. Built for the Simulator, so nothing is signed.
      - name: Build Cue Check
        working-directory: swift/CueCheck.swiftpm
        run: xcodebuild build -scheme "Cue Check" -destination "generic/platform=iOS Simulator"

  # The committed cues held to the oracle in real browsers, each rendering
  # both offline, and the editor's Cues view driven in each. One job per
  # browser, so each installs only its own build.
  browsers:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The engine's Playwright installs the browsers, and the editor's resolves
      # to the same version
      - name: Playwright version and OS release
        id: playwright
        run: |
          echo "version=$(pnpm --filter soundscape-engine exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "os=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      # The browser Playwright downloads, kept between runs. Playwright's version
      # and the OS release fix the browser's build, so either changing, as when
      # ubuntu-latest moves to a new release, downloads afresh.
      - name: Cache ${{ matrix.browser }}
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}

      # A stuck install once held a job for half an hour (#119). An install
      # takes under a minute, so each fails after five instead.
      - name: Install ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm --filter soundscape-engine exec playwright install --with-deps ${{ matrix.browser }}

      # A cached browser still needs the system libraries it runs on
      - name: Install ${{ matrix.browser }}'s system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: pnpm --filter soundscape-engine exec playwright install-deps ${{ matrix.browser }}

      - name: Cues against the oracle in ${{ matrix.browser }}
        run: pnpm --filter soundscape-engine test:browser --browser=${{ matrix.browser }}

      - name: The Cues view in ${{ matrix.browser }}
        run: pnpm --filter editor test:browser --browser=${{ matrix.browser }}
