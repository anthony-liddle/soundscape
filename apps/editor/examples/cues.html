<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>Soundscape Cues</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111827;
      color: #f3f4f6;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
    }
    h1 {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #9ca3af;
      margin-bottom: 2rem;
      max-width: 40rem;
    }
    .section {
      background: #1f2937;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      max-width: 40rem;
    }
    h2 {
      margin-top: 0;
      color: #e5e7eb;
      font-size: 1.25rem;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    button {
      min-height: 44px;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.primary {
      background: #3b82f6;
      color: white;
    }
    button.primary:hover {
      background: #2563eb;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }
    .notes,
    #status {
      color: #9ca3af;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 44px;
      cursor: pointer;
    }
    input[type='checkbox'] {
      width: 1.25rem;
      height: 1.25rem;
    }
    code {
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <h1>Soundscape Cues</h1>
  <p class="subtitle">
    Short sound effects from a cue document, each note scheduled on the audio
    clock. These two are Peach of a Word's tick and its length 8 mythic found
    word in the cute theme, from <code>examples/cues/peach.cues.json</code>.
  </p>

  <section class="section" aria-labelledby="cues-heading">
    <h2 id="cues-heading">Cues</h2>
    <ul id="cues"></ul>
    <label><input type="checkbox" id="mute"> Mute cues</label>
  </section>

  <p id="status" role="status" aria-live="polite">Press a cue to hear it.</p>

  <script type="module" src="/src/examples/cues.ts"></script>
</body>
</html>
