<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Bricolage';
    src: url(data:font/ttf;base64,__BRICOLAGE__) format('truetype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'GeistMono';
    src: url(data:font/ttf;base64,__GEISTMONO__) format('truetype');
  }
  * { margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b101d; }
  .wordmark {
    position: absolute; left: 64px; top: 440px;
    font-family: 'Bricolage'; font-weight: 700; font-size: 96px;
    color: #f4f6fb; letter-spacing: -0.015em; line-height: 1;
  }
  .tagline {
    position: absolute; left: 68px; top: 556px;
    font-family: 'GeistMono'; font-size: 18px;
    color: #7d8aa3; letter-spacing: 0.32em;
  }
  .meta {
    position: absolute; right: 64px; top: 585px;
    font-family: 'GeistMono'; font-size: 14px;
    color: #4c5872; letter-spacing: 0.18em;
  }
  .lane-label {
    position: absolute; left: 18px;
    font-family: 'GeistMono'; font-size: 12px;
    color: #35415a; letter-spacing: 0.1em;
  }
</style>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="depth" cx="42%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0b101d"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8edf8" stop-opacity="0"/>
      <stop offset="18%" stop-color="#e8edf8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#e8edf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e8edf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowBlue" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowAmber" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBeam" x="-300%" y="-20%" width="700%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#depth)"/>

  <!-- black-key lane shading (lane height 45) -->
  <g fill="#0e1526">
    <rect x="0" y="45"  width="1200" height="45"/>
    <rect x="0" y="135" width="1200" height="45"/>
    <rect x="0" y="225" width="1200" height="45"/>
    <rect x="0" y="315" width="1200" height="45"/>
    <rect x="0" y="405" width="1200" height="45"/>
    <rect x="0" y="495" width="1200" height="45"/>
    <rect x="0" y="585" width="1200" height="45"/>
  </g>

  <!-- pitch lanes -->
  <g stroke="#1c2740" stroke-width="1">
    <line x1="0" y1="45"  x2="1200" y2="45"/><line x1="0" y1="90"  x2="1200" y2="90"/>
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="225" x2="1200" y2="225"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="495" x2="1200" y2="495"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="585" x2="1200" y2="585"/>
  </g>

  <!-- beat lines (75px), bars every 4 beats stronger -->
  <g stroke="#1c2740" stroke-width="1">
    <line x1="75"   y1="0" x2="75"   y2="630"/><line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="225"  y1="0" x2="225"  y2="630"/><line x1="375" y1="0" x2="375" y2="630"/>
    <line x1="450"  y1="0" x2="450"  y2="630"/><line x1="525" y1="0" x2="525" y2="630"/>
    <line x1="675"  y1="0" x2="675"  y2="630"/><line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="825"  y1="0" x2="825"  y2="630"/><line x1="975" y1="0" x2="975" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/><line x1="1125" y1="0" x2="1125" y2="630"/>
  </g>
  <g stroke="#2a3854" stroke-width="1.5">
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- oscilloscope whisper, mid-field underlayer -->
  <path d="M 0 300 C 40 300 55 258 85 258 S 130 322 165 322 S 210 270 245 270 S 290 330 330 330 S 380 262 420 262 S 465 318 505 318 S 550 254 595 254 S 640 334 685 334 S 730 266 775 266 S 820 316 860 316 S 905 262 950 262 S 995 326 1040 326 S 1085 278 1125 278 S 1170 300 1200 300"
        fill="none" stroke="#3b82f6" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- purple answering voice (lower right) -->
  <g filter="url(#glowBlue)">
    <rect x="604" y="454" width="67" height="37" rx="7" fill="#8b5cf6" fill-opacity="0.42"/>
    <rect x="754" y="499" width="67" height="37" rx="7" fill="#8b5cf6" fill-opacity="0.50"/>
    <rect x="904" y="454" width="142" height="37" rx="7" fill="#8b5cf6" fill-opacity="0.44"/>
    <rect x="1054" y="499" width="67" height="37" rx="7" fill="#8b5cf6" fill-opacity="0.36"/>
  </g>

  <!-- principal voice in blue -->
  <g filter="url(#glowBlue)">
    <rect x="4"   y="409" width="67"  height="37" rx="7" fill="#3b82f6" fill-opacity="0.55"/>
    <rect x="79"  y="364" width="67"  height="37" rx="7" fill="#4f8bf7" fill-opacity="0.68"/>
    <rect x="154" y="319" width="67"  height="37" rx="7" fill="#4f8bf7" fill-opacity="0.78"/>
    <rect x="229" y="229" width="67"  height="37" rx="7" fill="#5b93f8" fill-opacity="0.88"/>
    <rect x="304" y="184" width="142" height="37" rx="7" fill="#669bfa" fill-opacity="0.96"/>
    <rect x="454" y="229" width="67"  height="37" rx="7" fill="#5b93f8" fill-opacity="0.85"/>
    <rect x="529" y="139" width="67"  height="37" rx="7" fill="#669bfa" fill-opacity="0.93"/>
    <rect x="754" y="184" width="67"  height="37" rx="7" fill="#5b93f8" fill-opacity="0.82"/>
    <rect x="829" y="274" width="67"  height="37" rx="7" fill="#4f8bf7" fill-opacity="0.72"/>
    <rect x="904" y="229" width="67"  height="37" rx="7" fill="#4f8bf7" fill-opacity="0.66"/>
    <rect x="979" y="319" width="142" height="37" rx="7" fill="#3b82f6" fill-opacity="0.55"/>
  </g>

  <!-- the sounding note, lit by the playhead -->
  <g filter="url(#glowAmber)">
    <rect x="604" y="94" width="142" height="37" rx="7" fill="#fbbf24" fill-opacity="0.98"/>
  </g>

  <!-- playhead: the present moment -->
  <g filter="url(#glowBeam)">
    <rect x="674" y="0" width="2.5" height="630" fill="url(#beam)"/>
  </g>
</svg>
<div class="wordmark">Soundscape</div>
<div class="tagline">BROWSER&nbsp;MUSIC&nbsp;SEQUENCER&nbsp;·&nbsp;SYNTHESIZER</div>
<div class="meta">16&nbsp;BEATS&nbsp;/&nbsp;120&nbsp;BPM&nbsp;/&nbsp;WEB&nbsp;AUDIO</div>
